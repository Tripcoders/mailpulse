app = "mailpulse-engine"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.engine"

[env]
  PORT = "3003"
  UPLOAD_DIR = "/tmp/upload"

[http_service]
  internal_port = 3003
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1